[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-smart-alerts"
version = "0.1.0"
description = "Ring events -> local YOLOv8 object detection -> Home Assistant notifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roger Morato" }]
keywords = ["ring", "doorbell", "home-assistant", "yolov8", "object-detection", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]
dependencies = [
    "ring-doorbell>=0.9.14",
    "ultralytics>=8.3",
    "requests>=2.31",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "open-clip-torch>=2.24",
]

[project.urls]
Homepage = "https://github.com/r-morato/ring-smart-alerts"
Issues = "https://github.com/r-morato/ring-smart-alerts/issues"

[project.scripts]
ring-smart-alerts = "ring_smart_alerts.main:_run"

[tool.setuptools]
packages = ["ring_smart_alerts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # test doubles deliberately accept unused args

[tool.pytest.ini_options]
testpaths = ["tests"]
