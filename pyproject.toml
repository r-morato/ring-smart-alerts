[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-smart-alerts"
version = "0.1.0"
description = "Ring events -> local YOLOv8 object detection -> Home Assistant notifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ring-doorbell>=0.9.14",
    "ultralytics>=8.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
ring-smart-alerts = "ring_smart_alerts.main:_run"

[tool.setuptools]
packages = ["ring_smart_alerts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # test doubles deliberately accept unused args

[tool.pytest.ini_options]
testpaths = ["tests"]
